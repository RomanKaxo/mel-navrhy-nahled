<svg xmlns="http://www.w3.org/2000/svg" class="mk ch mk-profil t-dark" data-s="done" role="img" width="256" height="256" viewBox="0 0 32 32"><style>
.mk{display:block;overflow:visible}
.mk .i{fill:var(--mk-ink)}.mk .a{fill:var(--mk-acc)}.mk .hi{fill:var(--mk-soft)}.mk .de{fill:var(--mk-deep)}.mk .dd{fill:var(--mk-deeper)}
.mk .p,.mk .g{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s,fill .35s}
.mk[data-s=done] .g{animation:mk-bump .7s cubic-bezier(.2,.8,.2,1)}
.mk[data-s=error] .g{animation:mk-shake .5s ease-in-out}
@keyframes mk-bump{0%{transform:scale(.88)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes mk-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5%)}45%{transform:translateX(4%)}70%{transform:translateX(-2%)}}
.t-dark{--mk-ink:#FAF6FF;--mk-acc:#F21B68;--mk-soft:#FF92BA;--mk-deep:#B3124F;--mk-deeper:#85254E}
.t-light{--mk-ink:#171522;--mk-acc:#F21B68;--mk-soft:#B3124F;--mk-deep:#B3124F;--mk-deeper:#85254E}
.t-mono{--mk-ink:currentColor;--mk-acc:currentColor;--mk-soft:currentColor;--mk-deep:currentColor;--mk-deeper:currentColor}
@media (prefers-reduced-motion:reduce){.mk *{animation:none!important;transition:none!important}}

.ch{--u:1px;--oy:1;--ex:1;--c-h:var(--mk-ink);--c-h2:var(--ch-h2);--c-e:var(--ch-e)}
.ch.g16{--u:.5px}
.t-dark.ch{--ch-h2:#CFC8DD;--ch-e:#171522}.t-light.ch{--ch-h2:#3A3648;--ch-e:#FAF6FF}
.ch .h{fill:var(--c-h);transition:fill .35s}.ch .h2{fill:var(--c-h2)}
.ch .e,.ch .ob,.ch .us{fill:var(--c-e)}
.ch .e,.ch .ob,.ch .us,.ch .rb,.ch .tel,.ch .oci,.ch .cap{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,fill .35s}
.ch .rb{fill:var(--mk-acc)}
.ch .e{transform:scale(var(--ex),var(--oy))}
.t-mono.ch .h,.t-mono.ch .h2{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:miter}
.t-mono.ch.g16 .h,.t-mono.ch.g16 .h2{stroke-width:1.1}
.t-mono.ch .e,.t-mono.ch .ob,.t-mono.ch .us{fill:currentColor}
/* klid: občas mrkne a rozhlédne se */
.ch[data-s=idle] .e{animation:ch-blink 5.6s ease-in-out infinite}
.ch[data-s=idle] .oci{animation:ch-gz-idle 11s ease-in-out infinite}
@keyframes ch-blink{0%,93%,100%{transform:scale(var(--ex),var(--oy))}96.5%{transform:scale(var(--ex),.08)}}
@keyframes ch-gz-idle{0%,34%,100%{transform:translate(0,0)}38%,52%{transform:translateX(calc(-1.2*var(--u)))}56%,72%{transform:translateX(calc(1.2*var(--u)))}76%{transform:translate(0,0)}}
/* přemýšlí: pohled nahoru a stranou */
.ch[data-s=thinking]{--oy:.82}
.ch[data-s=thinking] .oci{transform:translate(calc(1.3*var(--u)),calc(-1.1*var(--u)));animation:ch-gz-th 3.8s ease-in-out infinite}
.ch[data-s=thinking] .e{animation:ch-blink 4.4s ease-in-out infinite}
@keyframes ch-gz-th{0%,40%,100%{transform:translate(calc(1.3*var(--u)),calc(-1.1*var(--u)))}52%,86%{transform:translate(calc(-1.1*var(--u)),calc(-1.1*var(--u)))}}
.ch[data-s=thinking] .b1{transform:translateY(calc(-1.6*var(--u)))}
.ch[data-s=thinking] .b2{transform:translateY(calc(.5*var(--u)))}
.ch[data-s=thinking] .us{transform:translateX(calc(1.2*var(--u))) scaleX(.62)}
.ch[data-s=thinking] .rb{fill:var(--mk-soft);animation:ch-pul 2.6s ease-in-out infinite}
@keyframes ch-pul{0%,100%{opacity:.45}50%{opacity:1}}
/* pracuje: soustředěně přivřené oči, čte zleva doprava */
.ch[data-s=working]{--oy:.55}
.ch[data-s=working] .oci{animation:ch-gz-wk 1.5s ease-in-out infinite alternate}
@keyframes ch-gz-wk{from{transform:translateX(calc(-1.4*var(--u)))}to{transform:translateX(calc(1.4*var(--u)))}}
.ch[data-s=working] .e{animation:ch-blink 3.2s ease-in-out infinite}
.ch[data-s=working] .ob{transform:translateY(calc(1*var(--u)))}
.ch[data-s=working] .us{transform:scaleX(.8)}
.ch[data-s=working] .rb{animation:ch-rb-wk 1s ease-in-out infinite}
@keyframes ch-rb-wk{0%,100%{transform:scale(.72)}50%{transform:scale(1.12)}}
/* čeká: dívá se přímo na tebe, zvednuté obočí, nakloněná hlava */
.ch[data-s=waiting]{--oy:1.08}
.ch[data-s=waiting] .tel{transform:rotate(-5deg)}
.ch[data-s=waiting] .e{animation:ch-blink 7s ease-in-out infinite}
.ch[data-s=waiting] .b2{transform:translateY(calc(-2.2*var(--u)))}
.ch[data-s=waiting] .rb{transform:scale(1.28);animation:ch-pul 2.1s ease-in-out infinite}
/* chyba: pohled dolů, stažené obočí, pokleslá ústa, rubín mimo */
.ch[data-s=error]{--oy:.5}
.ch[data-s=error] .oci{transform:translate(calc(-1*var(--u)),calc(1.2*var(--u)))}
.ch[data-s=error] .b1{transform:translateY(calc(.6*var(--u))) rotate(13deg)}
.ch[data-s=error] .b2{transform:translateY(calc(.6*var(--u))) rotate(-13deg)}
.ch[data-s=error] .us{transform:translateY(calc(.8*var(--u))) rotate(-11deg)}
.ch[data-s=error] .rb{fill:var(--mk-ink);transform:rotate(45deg) scale(.68)}
.t-light.ch[data-s=error] .rb,.t-dark.ch[data-s=error] .rb{fill:var(--mk-deep)}
.t-mono.ch[data-s] .rb{fill:currentColor}
/* hotovo: uvolněné přivřené oči, krátké kývnutí, náznak úsměvu jedním koutkem */
.ch[data-s=done]{--oy:.36}
.ch[data-s=done] .ob{transform:translateY(calc(-.9*var(--u)))}
.ch[data-s=done] .us{transform:rotate(-8deg) scaleX(1.1)}
.ch[data-s=done] .rb{transform:scale(1.14)}
.ch[data-s=done] .g{animation:ch-nod .8s cubic-bezier(.2,.8,.2,1)}
@keyframes ch-nod{0%{transform:translateY(0)}35%{transform:translateY(5%)}100%{transform:translateY(0)}}

.mk-profil .cap{fill:var(--mk-acc);transition:fill .35s;transform-box:fill-box}
.t-mono.mk-profil .cap{fill:currentColor}
.mk-profil[data-s=thinking] .cap{fill:var(--mk-soft)}
.mk-profil[data-s=error] .cap{fill:var(--mk-deep)}
.mk-profil[data-s=waiting] .tel{transform:rotate(-3deg)}
.t-mono.mk-profil[data-s] .cap{fill:currentColor}</style><title>Mel, Profil: Hotovo</title><g class="g"><g class="tel"><polygon class="h" points="8,2.5 20.5,1.5 26.5,7 27,13 30.5,18.5 27,20 27,25 23,28.5 19,28.5 19,31 6,31 6,23 2.5,15 3,8"/><polygon class="cap" points="8,2.5 20.5,1.5 13.5,8 13.5,15.5 8.5,23 6,23 2.5,15 3,8"/><polygon class="ob b1" points="17.5,7.5 25,8.7 25,10.5 17.5,9.3"/><g class="oci"><polygon class="e e1" points="21.2,11.1 23.099999999999998,13 21.2,14.9 19.3,13"/></g><polygon class="us" points="20.6,22.8 26.4,22.8 26.4,24.4 20.6,24.4"/></g></g></svg>