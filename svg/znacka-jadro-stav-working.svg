<svg xmlns="http://www.w3.org/2000/svg" class="mk mk-jadro t-dark" data-s="working" role="img" width="256" height="256" viewBox="0 0 32 32"><style>
.mk{display:block;overflow:visible}
.mk .i{fill:var(--mk-ink)}.mk .a{fill:var(--mk-acc)}.mk .hi{fill:var(--mk-soft)}.mk .de{fill:var(--mk-deep)}.mk .dd{fill:var(--mk-deeper)}
.mk .p,.mk .g{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s,fill .35s}
.mk[data-s=done] .g{animation:mk-bump .7s cubic-bezier(.2,.8,.2,1)}
.mk[data-s=error] .g{animation:mk-shake .5s ease-in-out}
@keyframes mk-bump{0%{transform:scale(.88)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes mk-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5%)}45%{transform:translateX(4%)}70%{transform:translateX(-2%)}}
.t-dark{--mk-ink:#FAF6FF;--mk-acc:#F21B68;--mk-soft:#FF92BA;--mk-deep:#B3124F;--mk-deeper:#85254E}
.t-light{--mk-ink:#171522;--mk-acc:#F21B68;--mk-soft:#B3124F;--mk-deep:#B3124F;--mk-deeper:#85254E}
.t-mono{--mk-ink:currentColor;--mk-acc:currentColor;--mk-soft:currentColor;--mk-deep:currentColor;--mk-deeper:currentColor}
@media (prefers-reduced-motion:reduce){.mk *{animation:none!important;transition:none!important}}

.mk-jadro .ring{fill:none;stroke:var(--mk-ink);stroke-width:3.8;stroke-dasharray:82 18;transform:rotate(-60deg);transition:stroke-dasharray .5s,transform .5s,stroke .35s,opacity .35s}
.mk-jadro.g16 .ring{stroke-width:2}
.mk-jadro[data-s=thinking] .ring{stroke:var(--mk-soft);stroke-dasharray:58 42;animation:ja-rot 5s linear infinite}
.mk-jadro[data-s=thinking] .p2{animation:ja-br 2.4s ease-in-out infinite}
@keyframes ja-rot{from{transform:rotate(-60deg)}to{transform:rotate(300deg)}}
@keyframes ja-br{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
.mk-jadro[data-s=working] .ring{stroke:var(--mk-acc);stroke-dasharray:28 72;animation:ja-rot 1.15s linear infinite}
.mk-jadro[data-s=waiting] .ring{stroke:var(--mk-acc);stroke-dasharray:100 0;animation:ja-wt 2.2s ease-in-out infinite}
.mk-jadro[data-s=waiting] .p2{fill:var(--mk-ink);transform:scale(.5)}
@keyframes ja-wt{0%,100%{opacity:1}50%{opacity:.35}}
.mk-jadro[data-s=error] .ring{stroke-dasharray:30 70;transform:rotate(110deg)}
.mk-jadro[data-s=error] .p2{fill:var(--mk-ink);transform:translate(26%,-26%)}
.mk-jadro[data-s=done] .ring{stroke:var(--mk-acc);stroke-dasharray:100 0;transform:rotate(0)}
.mk-jadro[data-s=done] .p2{fill:var(--mk-acc);transform:scale(1.25)}</style><title>Mel, Jádro: Pracuje</title><g class="g"><circle class="p p1 ring" cx="16" cy="16" r="12.5" pathLength="100"/><polygon class="p p2 a" points="16,10.4 21.6,16 16,21.6 10.4,16"/></g></svg>