<svg xmlns="http://www.w3.org/2000/svg" class="mk ch ch2 mk-displej t-mono" data-s="idle" role="img" width="256" height="256" viewBox="0 0 32 32"><style>
.mk{display:block;overflow:visible}
.mk .i{fill:var(--mk-ink)}.mk .a{fill:var(--mk-acc)}.mk .hi{fill:var(--mk-soft)}.mk .de{fill:var(--mk-deep)}.mk .dd{fill:var(--mk-deeper)}
.mk .p,.mk .g{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s,fill .35s}
.mk[data-s=done] .g{animation:mk-bump .7s cubic-bezier(.2,.8,.2,1)}
.mk[data-s=error] .g{animation:mk-shake .5s ease-in-out}
@keyframes mk-bump{0%{transform:scale(.88)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes mk-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5%)}45%{transform:translateX(4%)}70%{transform:translateX(-2%)}}
.t-dark{--mk-ink:#FAF6FF;--mk-acc:#F21B68;--mk-soft:#FF92BA;--mk-deep:#B3124F;--mk-deeper:#85254E}
.t-light{--mk-ink:#171522;--mk-acc:#F21B68;--mk-soft:#B3124F;--mk-deep:#B3124F;--mk-deeper:#85254E}
.t-mono{--mk-ink:currentColor;--mk-acc:currentColor;--mk-soft:currentColor;--mk-deep:currentColor;--mk-deeper:currentColor}
@media (prefers-reduced-motion:reduce){.mk *{animation:none!important;transition:none!important}}

.ch{--u:1px;--oy:1;--ex:1;--c-h:var(--mk-ink);--c-h2:var(--ch-h2);--c-e:var(--ch-e)}
.ch.g16{--u:.5px}
.t-dark.ch{--ch-h2:#CFC8DD;--ch-e:#171522}.t-light.ch{--ch-h2:#3A3648;--ch-e:#FAF6FF}
.ch .h{fill:var(--c-h);transition:fill .35s}.ch .h2{fill:var(--c-h2)}
.ch .e,.ch .ob,.ch .us{fill:var(--c-e)}
.ch .e,.ch .ob,.ch .us,.ch .rb,.ch .tel,.ch .oci,.ch .cap{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,fill .35s}
.ch .rb{fill:var(--mk-acc)}
.ch .e{transform:scale(var(--ex),var(--oy))}
.t-mono.ch .h,.t-mono.ch .h2{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:miter}
.t-mono.ch.g16 .h,.t-mono.ch.g16 .h2{stroke-width:1.1}
.t-mono.ch .e,.t-mono.ch .ob,.t-mono.ch .us{fill:currentColor}
/* klid: občas mrkne a rozhlédne se */
.ch[data-s=idle] .e{animation:ch-blink 5.6s ease-in-out infinite}
.ch[data-s=idle] .oci{animation:ch-gz-idle 11s ease-in-out infinite}
@keyframes ch-blink{0%,93%,100%{transform:scale(var(--ex),var(--oy))}96.5%{transform:scale(var(--ex),.08)}}
@keyframes ch-gz-idle{0%,34%,100%{transform:translate(0,0)}38%,52%{transform:translateX(calc(-1.2*var(--u)))}56%,72%{transform:translateX(calc(1.2*var(--u)))}76%{transform:translate(0,0)}}
/* přemýšlí: pohled nahoru a stranou */
.ch[data-s=thinking]{--oy:.82}
.ch[data-s=thinking] .oci{transform:translate(calc(1.3*var(--u)),calc(-1.1*var(--u)));animation:ch-gz-th 3.8s ease-in-out infinite}
.ch[data-s=thinking] .e{animation:ch-blink 4.4s ease-in-out infinite}
@keyframes ch-gz-th{0%,40%,100%{transform:translate(calc(1.3*var(--u)),calc(-1.1*var(--u)))}52%,86%{transform:translate(calc(-1.1*var(--u)),calc(-1.1*var(--u)))}}
.ch[data-s=thinking] .b1{transform:translateY(calc(-1.6*var(--u)))}
.ch[data-s=thinking] .b2{transform:translateY(calc(.5*var(--u)))}
.ch[data-s=thinking] .us{transform:translateX(calc(1.2*var(--u))) scaleX(.62)}
.ch[data-s=thinking] .rb{fill:var(--mk-soft);animation:ch-pul 2.6s ease-in-out infinite}
@keyframes ch-pul{0%,100%{opacity:.45}50%{opacity:1}}
/* pracuje: soustředěně přivřené oči, čte zleva doprava */
.ch[data-s=working]{--oy:.55}
.ch[data-s=working] .oci{animation:ch-gz-wk 1.5s ease-in-out infinite alternate}
@keyframes ch-gz-wk{from{transform:translateX(calc(-1.4*var(--u)))}to{transform:translateX(calc(1.4*var(--u)))}}
.ch[data-s=working] .e{animation:ch-blink 3.2s ease-in-out infinite}
.ch[data-s=working] .ob{transform:translateY(calc(1*var(--u)))}
.ch[data-s=working] .us{transform:scaleX(.8)}
.ch[data-s=working] .rb{animation:ch-rb-wk 1s ease-in-out infinite}
@keyframes ch-rb-wk{0%,100%{transform:scale(.72)}50%{transform:scale(1.12)}}
/* čeká: dívá se přímo na tebe, zvednuté obočí, nakloněná hlava */
.ch[data-s=waiting]{--oy:1.08}
.ch[data-s=waiting] .tel{transform:rotate(-5deg)}
.ch[data-s=waiting] .e{animation:ch-blink 7s ease-in-out infinite}
.ch[data-s=waiting] .b2{transform:translateY(calc(-2.2*var(--u)))}
.ch[data-s=waiting] .rb{transform:scale(1.28);animation:ch-pul 2.1s ease-in-out infinite}
/* chyba: pohled dolů, stažené obočí, pokleslá ústa, rubín mimo */
.ch[data-s=error]{--oy:.5}
.ch[data-s=error] .oci{transform:translate(calc(-1*var(--u)),calc(1.2*var(--u)))}
.ch[data-s=error] .b1{transform:translateY(calc(.6*var(--u))) rotate(13deg)}
.ch[data-s=error] .b2{transform:translateY(calc(.6*var(--u))) rotate(-13deg)}
.ch[data-s=error] .us{transform:translateY(calc(.8*var(--u))) rotate(-11deg)}
.ch[data-s=error] .rb{fill:var(--mk-ink);transform:rotate(45deg) scale(.68)}
.t-light.ch[data-s=error] .rb,.t-dark.ch[data-s=error] .rb{fill:var(--mk-deep)}
.t-mono.ch[data-s] .rb{fill:currentColor}
/* hotovo: uvolněné přivřené oči, krátké kývnutí, náznak úsměvu jedním koutkem */
.ch[data-s=done]{--oy:.36}
.ch[data-s=done] .ob{transform:translateY(calc(-.9*var(--u)))}
.ch[data-s=done] .us{transform:rotate(-8deg) scaleX(1.1)}
.ch[data-s=done] .rb{transform:scale(1.14)}
.ch[data-s=done] .g{animation:ch-nod .8s cubic-bezier(.2,.8,.2,1)}
@keyframes ch-nod{0%{transform:translateY(0)}35%{transform:translateY(5%)}100%{transform:translateY(0)}}

.ch2{--ky:.08;--kd:0;--c-pl:#171522;--c-sk:#FAF6FF;--c-zo:#171522;--c-us:#FAF6FF;--c-vk:var(--c-pl)}
.t-light.ch2{--c-pl:#3A3648}
.ch2 .pl{fill:var(--c-pl)}.ch2 .sk{fill:var(--c-sk)}.ch2 .zo{fill:var(--c-zo)}.ch2 .ir{fill:var(--mk-acc)}
.ch2 .e{fill:var(--c-sk)}
.ch2 .vk,.ch2 .vd{fill:var(--c-vk);transform-box:fill-box;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ch2 .vk{transform-origin:50% 0;transform:scaleY(var(--ky))}
.ch2 .vd{transform-origin:50% 100%;transform:scaleY(var(--kd))}
.ch2 .mu{fill:none;stroke:var(--c-us);stroke-width:1.7;stroke-linecap:round;opacity:0;transition:opacity .3s,transform .4s;transform-box:fill-box;transform-origin:center}
.ch2.g16 .mu{stroke-width:1}
.ch2 .pbg,.ch2 .dt{fill:var(--c-sk)}
/* výrazy */
.ch2[data-s=idle] .m-s,.ch2[data-s=done] .m-s,.ch2[data-s=thinking] .m-n,.ch2[data-s=working] .m-n,.ch2[data-s=waiting] .m-o,.ch2[data-s=error] .m-t{opacity:1}
.ch2[data-s=thinking]{--ky:.03;--kd:.1}.ch2[data-s=working]{--ky:.12;--kd:.3}.ch2[data-s=waiting]{--ky:0}.ch2[data-s=error]{--ky:.36}.ch2[data-s=done]{--ky:.04;--kd:.5}
.ch2[data-s=idle] .vk,.ch2[data-s=thinking] .vk,.ch2[data-s=working] .vk,.ch2[data-s=waiting] .vk{animation:c2-bl 5.2s ease-in-out infinite}
.ch2[data-s=thinking] .vk{animation-duration:4.2s}.ch2[data-s=working] .vk{animation-duration:3.3s}.ch2[data-s=waiting] .vk{animation-duration:6.4s}
@keyframes c2-bl{0%,93%,100%{transform:scaleY(var(--ky))}96.5%{transform:scaleY(1)}}
.ch2[data-s=error] .vk1{transform:rotate(-11deg) scaleY(var(--ky))}.ch2[data-s=error] .vk2{transform:rotate(11deg) scaleY(var(--ky))}
.ch2[data-s=error] .oci{transform:translate(0,calc(1.1*var(--u)))}
.ch2[data-s=done] .m-s{transform:scale(1.25)}
.ch2[data-s=thinking] .m-n{transform:translateX(calc(1.2*var(--u))) scaleX(.6)}
.ch2[data-s=working] .tel{animation:c2-nod 1.5s ease-in-out infinite}
@keyframes c2-nod{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(.5*var(--u)))}}
.ch2[data-s=error] .tel{transform:translateY(calc(.8*var(--u))) rotate(3deg)}
.t-mono.ch2 .pl{fill:none;stroke:currentColor;stroke-width:1.2}.t-mono.ch2.g16 .pl{stroke:none}
.t-mono.ch2 .sk{fill:none;stroke:currentColor;stroke-width:1.2}.t-mono.ch2 .zo,.t-mono.ch2 .ir,.t-mono.ch2 .e{fill:currentColor}
.t-mono.ch2 .vk,.t-mono.ch2 .vd{display:none}.t-mono.ch2 .mu{stroke:currentColor}

.mk-displej .noha{fill:var(--mk-acc)}.t-mono.mk-displej .noha{fill:currentColor}
.mk-displej .sym{fill:none;stroke:var(--c-sk);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s}
.mk-displej.g16 .sym{stroke-width:1}.t-mono.mk-displej .sym{stroke:currentColor}
.mk-displej .pbg,.mk-displej .pf,.mk-displej .dt{opacity:0;transition:opacity .3s}
.mk-displej .pbg{fill:var(--c-sk)}.mk-displej .pf{fill:var(--mk-acc);transform-box:fill-box;transform-origin:0 50%}
.t-mono.mk-displej .pf,.t-mono.mk-displej .pbg,.t-mono.mk-displej .dt{fill:currentColor}.t-mono.mk-displej .e{fill:currentColor}
.mk-displej .e{animation:ch-blink 5.2s ease-in-out infinite;transition:opacity .25s}
.mk-displej[data-s=thinking] .m-n,.mk-displej[data-s=working] .m-n{opacity:0}
.mk-displej[data-s=thinking] .dt{opacity:1;animation:ch-pul 1.2s ease-in-out infinite}
.mk-displej[data-s=thinking] .d2{animation-delay:.2s}.mk-displej[data-s=thinking] .d3{animation-delay:.4s}
.mk-displej[data-s=working]{--oy:.62}
.mk-displej[data-s=working] .pbg{opacity:.22}.mk-displej[data-s=working] .pf{opacity:1;transform:scaleX(.55);animation:di-pr 2.2s ease-in-out infinite}
@keyframes di-pr{0%{transform:scaleX(.08)}80%,100%{transform:scaleX(1)}}
.mk-displej[data-s=waiting] .e2{transform:scale(1,1.3)}
.mk-displej[data-s=waiting] .m-o{animation:ch-pul 1.1s ease-in-out infinite}
.mk-displej[data-s=error] .e,.mk-displej[data-s=done] .e{opacity:0;animation:none}
.mk-displej[data-s=error] .x{opacity:1}.mk-displej[data-s=done] .ar{opacity:1;stroke:var(--mk-soft)}
.t-mono.mk-displej[data-s] .ar{stroke:currentColor}
.mk-displej[data-s=waiting] .tel{transform:rotate(-4deg)}</style><title>Mel, návrh Displej</title><g class="g"><g class="tel"><rect class="h" x="12.8" y="22" width="6.4" height="5"/><rect class="noha" x="8.5" y="26" width="15" height="3" rx="1.5"/><rect class="h" x="2.5" y="3" width="27" height="20.5" rx="4.5"/><rect class="pl" x="5" y="5.5" width="22" height="15.5" rx="2.6"/><g class="oci"><rect class="e e1" x="10.4" y="9" width="3.4" height="4.4" rx=".9"/><rect class="e e2" x="18.2" y="9" width="3.4" height="4.4" rx=".9"/></g><path class="sym x x1" d="M10 9.2l4 4m0-4l-4 4"/><path class="sym x x2" d="M18 9.2l4 4m0-4l-4 4"/><path class="sym ar" d="M9.8 12.8l2.3-2.8 2.3 2.8M17.8 12.8l2.3-2.8 2.3 2.8"/><path class="mu m-s" d="M12.8 16.4q3.2 1.8 6.4 0"/><path class="mu m-n" d="M13.44 17h5.120000000000001"/><path class="mu m-t" d="M13.44 17.599999999999998q2.5600000000000005 -1.8 5.120000000000001 0"/><path class="mu m-o" d="M14.56 16.9h2.8800000000000003"/><rect class="pbg" x="9.5" y="16.4" width="13" height="1.8" rx=".9"/><rect class="pf" x="9.5" y="16.4" width="13" height="1.8" rx=".9"/><rect class="dt d1" x="11.6" y="16" width="2" height="2"/><rect class="dt d2" x="15" y="16" width="2" height="2"/><rect class="dt d3" x="18.4" y="16" width="2" height="2"/></g></g></svg>